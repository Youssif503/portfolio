<article class="p-8 md:p-10 group rounded-2xl transition-colors hover:bg-white/[0.02]" appScrollStagger>
  <a class="block" [href]="post.url">
    <div class="font-label-sm text-label-sm text-on-surface-variant/50 mb-4 tracking-widest">
      {{ post.date }}
    </div>
    <h3 class="font-headline-md text-headline-md text-primary mb-4 group-hover:text-primary/80 transition-colors">
      {{ post.title }}</h3>
    <p class="font-body-md text-body-md text-on-surface-variant max-w-3xl leading-relaxed font-light">
      {{ post.excerpt }}
    </p>
  </a>
</article>

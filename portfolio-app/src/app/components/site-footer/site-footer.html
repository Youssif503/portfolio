<footer class="bg-transparent border-t border-white/[0.03] w-full mt-32 relative z-10">
  <div
    class="flex flex-col md:flex-row justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-12 max-w-container-max mx-auto gap-8">

    <div class="flex items-center gap-6 text-sm text-on-surface-variant/60">
      @for (link of socialLinks; track link.href) {
        <a [href]="link.href" [attr.target]="link.external ? '_blank' : null"
          [attr.rel]="link.external ? 'noopener noreferrer' : null" class="hover:text-primary transition-colors">
          {{ link.label }}
        </a>
      }
    </div>

    <div class="text-sm text-on-surface-variant/60">
      {{ footerText }}
    </div>

  </div>
</footer>
